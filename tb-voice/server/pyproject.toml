[project]
name = "tb-voice"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pipecat-ai[assemblyai,elevenlabs,local,local-smart-turn-v3,openai,runner,silero,webrtc]>=1.11.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
