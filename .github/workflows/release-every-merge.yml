name: Release every merge

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full main-branch commit SHA to recover or re-audit
        required: true
        type: string

# Serialized, and the newest main goes next. One group means no parallel
# notarizations and no two builds racing for Latest. GitHub's default for a
# group keeps the running build and ONE pending run, replaced by each newer
# push, which is the whole point: main is cumulative, so releasing its head
# releases every commit before it. This used `queue: max` (keep every pending
# run, release each commit in order) and on 15 Sep fourteen merges in ninety
# minutes put Prod an hour behind main, one twelve-minute build at a time.
# A skipped commit is still buildable on demand through workflow_dispatch.
# Not cancel-in-progress: that would also kill the running build, and on a
# busy day nothing would ever finish.
concurrency:
  group: release-main

permissions:
  contents: read

jobs:
  build:
    name: Audit and assemble unsigned app
    if: github.repository == 'robertnowell/tranquility-base'
    # The app targets macOS 14; SDK 26 carries the AppKit/Dispatch concurrency
    # annotations this Swift 6 code is compiled against locally.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the hermetic transport dependency
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi

      - name: Re-audit and assemble without release credentials
        env:
          TARGET_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit must be a full lowercase 40-character SHA" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          if [ -x scripts/audit-source.sh ]; then
            scripts/audit-source.sh "$TARGET_COMMIT"
          else
            # Historical recovery uses the gate versioned with that source.
            # Commits predating audit-source.sh require a named local branch.
            git checkout -B ci-release "$TARGET_COMMIT"
            TB_SKIP_LIVE_HARNESS_DRILLS=1 scripts/preflight.sh "$TARGET_COMMIT^"
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          scripts/prepare-release-app.sh
          tar -czf .build/unsigned-tranquility-base.tgz \
            -C .build/bundle/release "Tranquility Base.app" "Tranquility Base.dSYM"

      - name: Transfer the source-stamped app to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-tranquility-base
          path: .build/unsigned-tranquility-base.tgz
          if-no-files-found: error
          retention-days: 1


      - name: Retain test progress and stall diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Sign, notarize, audit, and publish
    needs: build
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch runs at the current default-branch SHA. Keep that
          # repaired tooling while the build job supplies the requested old
          # source commit as a prebuilt, source-stamped app.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the debug-symbol uploader
        run: brew install sentry-cli

      - name: Download the prebuilt app
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: unsigned-tranquility-base
          path: .build/ci-artifact

      - name: Restore the app without running product build code
        run: |
          mkdir -p .build/bundle/release
          tar -xzf .build/ci-artifact/unsigned-tranquility-base.tgz -C .build/bundle/release

      - name: Sign, notarize, audit, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TARGET_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          TB_DEVELOPER_ID_P12_BASE64: ${{ secrets.TB_DEVELOPER_ID_P12_BASE64 }}
          TB_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.TB_DEVELOPER_ID_P12_PASSWORD }}
          TB_NOTARY_APPLE_ID: ${{ secrets.TB_NOTARY_APPLE_ID }}
          TB_NOTARY_APP_PASSWORD: ${{ secrets.TB_NOTARY_APP_PASSWORD }}
          TB_SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.TB_SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          TB_RELEASE_SOURCE_COMMIT="$TARGET_COMMIT" \
            TB_PREBUILT_APP=1 TB_SKIP_SOURCE_AUDIT=1 scripts/ci-release.sh
