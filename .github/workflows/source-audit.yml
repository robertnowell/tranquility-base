name: Source audit

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  audit:
    name: Source audit
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the hermetic transport dependency
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi

      - name: Audit the source as it would land
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git checkout -B ci-source-audit "$GITHUB_SHA"
          TB_SKIP_LIVE_HARNESS_DRILLS=1 scripts/preflight.sh "origin/$BASE_REF"
