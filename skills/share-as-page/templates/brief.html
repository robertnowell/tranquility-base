<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- brief.html: the house template for a report one person reads to act.
     Three levels, far apart. The message they cannot miss. The claims they can
     skim. The artifact they open only to check. Read references/brief.md first.
     Worked example: agents/a8e3f054-8583-45f2-8bc0-3dfe55d47a06/uvape-what-is-different-redone.html

     v2, 27 Sep 2026: artifacts are no longer boxes. Whitespace first, a single
     rule second, a box only for code. Quotes get a left rule. Code and raw rows
     get a light neutral panel with full-contrast text (never dark on light).
     Screenshots get a hairline, a sentence caption below, and the passage
     marked on the image. Labels became captions. See references/brief.md,
     "Artifacts". -->
<meta name="intranet:session" content="<!-- FULL SESSION ID -->">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!-- TITLE: two to five words, the message, not the topic --></title>
<meta name="description" content="<!-- one sentence -->">
<meta name="intranet:brand" content="<!-- BRAND -->">
<meta name="intranet:type" content="<!-- research|page|runbook|plan|audit|design -->">
<meta name="intranet:summary" content="<!-- the answer in one sentence, not the topic -->">
<meta name="intranet:tags" content="<!-- 2 to 4 tags from hq-tags -->">
<meta name="intranet:status" content="final">
<meta name="intranet:visibility" content="local">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%234a5a2b%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%226%22 fill=%22%23fcfbf8%22/%3E%3C/svg%3E">
<style>
/* TOKENS. Replace this whole :root block with the output of hq-theme.
   The page wears the brand it is about: `hq-theme <session> --brand=NAME` once
   per session binds it, and `hq-theme <session>` keeps it on every later page.
   A page about nobody wears the house. If the header says NO THEME ON RECORD,
   research the brand (Kopi record, site) and `hq-theme --learn=NAME --accent=#hex
   --from='source'`; say in one line what you recorded; never ask permission.
   The block below is the house default so the file renders before you do. */
:root{--bg:#fcfbf8;--paper:#f4f2ec;--ink:#1f1e1c;--heading:#141312;--muted:#57534c;--faint:#6e6a63;--line:#ddd9cf;--accent:#4a5a2b;--brand:#1a1a1a;--amber:#a8762a;--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--sans:ui-sans-serif,-apple-system,'Helvetica Neue',sans-serif;--mono:'Berkeley Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--red:#9a3b2e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131310;--paper:#1c1b18;--ink:#eceae2;--heading:#f3f1e9;--muted:#a5a196;--faint:#77746c;--line:#33322d}}
:root[data-theme="dark"]{--bg:#131310;--paper:#1c1b18;--ink:#eceae2;--heading:#f3f1e9;--muted:#a5a196;--faint:#77746c;--line:#33322d}
/* HOUSE CONSTANTS, not brand tokens. The code panel is a neutral, not the
   brand paper: beige on beige is what the reader could not parse. Diff tints
   are GitHub's (Primer), whose contrast lives in the text colour, and they are
   used only in code contexts, as Primer's own token file says. */
:root{--panel:#f2f3f4;--panel-ink:#1a1c1f;--panel-line:#d6d9dd;--diff-add-bg:#dafbe1;--diff-add:#116329;--diff-del-bg:#ffebe9;--diff-del:#82071e;--mark:#ffd400}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:#1e2024;--panel-ink:#e8e9eb;--panel-line:#3a3d42;--diff-add-bg:#12351c;--diff-add:#7ee787;--diff-del-bg:#3b1a1c;--diff-del:#ffa198}}

/* LEVEL 1: the message. One sentence at 54px, one lede, one dark block for what needs them. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:56px 20px 96px}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(34px,6vw,54px);line-height:1.02;letter-spacing:-.025em;font-weight:700;color:var(--heading);margin:14px 0 22px;max-width:19ch}
.lede{font-size:21px;line-height:1.35;color:var(--ink);max-width:34ch;margin:0}
.lede b{color:var(--heading)}
.you{margin:44px 0 0;padding:22px 24px;border-radius:12px;background:var(--heading);color:var(--bg)}
.you .k{color:#b9c48f}
.you p{font-size:22px;line-height:1.3;margin:6px 0 0;font-weight:600}
.you small{display:block;font-size:14px;margin-top:8px;opacity:.75;font-weight:400}
/* Options are regular weight, one line each. The recommendation is MARKED, not bolded:
   a bold option list is a wall (Butterick: if everything is emphasized, nothing is). */
.you ol{margin:12px 0 0;padding:0;list-style:none;font-size:17px;line-height:1.4}
.you li{margin:6px 0;padding-left:22px;position:relative;font-weight:400}
.you li::before{content:'';position:absolute;left:0;top:.52em;width:9px;height:9px;border-radius:50%;border:1.5px solid #b9c48f}
.you li.rec::before{background:#b9c48f}
.you li.rec::after{content:"recommended";margin-left:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#b9c48f}
.you .q{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b9c48f;margin:18px 0 4px}

/* LEVEL 2: the claims. A section label, then rows. Each row is a claim in one sentence, a status dot and its figure. */
h2{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:72px 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:baseline;padding:20px 0}
summary::-webkit-details-marker{display:none}
summary .n{font-family:var(--mono);font-size:13px;color:var(--faint);padding-top:4px}
summary .c{font-size:21px;line-height:1.25;font-weight:600;color:var(--heading);letter-spacing:-.01em}
summary .c em{font-style:normal;color:var(--muted);font-weight:400;display:block;font-size:15px;margin-top:5px}
summary .s{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;padding-top:4px}
summary .s::after{content:'+';display:inline-block;margin-left:12px;color:var(--faint);font-size:14px;width:10px}
details[open] summary .s::after{content:'–'}
summary .s i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0;background:var(--accent)}
summary .s i.w{background:var(--amber)}summary .s i.o{background:transparent;border:1.5px solid var(--faint);width:7px;height:7px}
/* An open or hovered row marks its NUMBER in the accent, never the heading text: a light brand accent (U Vape's pink) is unreadable as running text. */
summary:hover .c{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
details[open] summary .n{color:var(--accent);font-weight:700}
.small summary{padding:14px 0}
.small summary .c{font-size:16px;font-weight:500}

/* LEVEL 3: the artifacts, collapsed under their claim. Whitespace first, a rule second, a box only for code. */
.d{padding:4px 0 30px 48px;display:grid;gap:26px}
.d p{margin:0;font-size:15px;color:var(--ink)}
.d p b{color:var(--heading)}
/* Every artifact carries a CAPTION BELOW, a sentence in full ink that lets it stand alone:
   what it is, where it came from, when. Source links live in it. Never a label above. */
figure{margin:0}
figcaption{font-size:13.5px;line-height:1.45;color:var(--ink);margin-top:9px}
figcaption a{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
figcaption .src{color:var(--muted)}
/* CODE, DIFF, RAW ROWS: dark text on a light neutral panel. Hairline, radius 4, no label bar. */
.code pre{margin:0;padding:12px 14px;background:var(--panel);color:var(--panel-ink);border:1px solid var(--panel-line);border-radius:4px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.code pre b{color:var(--diff-del);font-weight:600}
.code pre .add{display:block;background:var(--diff-add-bg);color:var(--diff-add);margin:0 -14px;padding:0 14px}
.code pre .del{display:block;background:var(--diff-del-bg);color:var(--diff-del);margin:0 -14px;padding:0 14px;text-decoration:none}
/* QUOTE: a left rule and an indent, one step down in size, no marks, no fill. Attribution in the caption. */
.quote blockquote{margin:0;padding:2px 0 2px 18px;border-left:3px solid var(--accent);font-size:16px;line-height:1.45;color:var(--ink)}
.quote blockquote p{margin:0 0 6px}
.quote blockquote p:last-child{margin:0}
/* SCREENSHOT: a hairline, no shadow, no frame. The passage is MARKED on the image. */
.shot .frame{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.shot img{display:block;width:100%;height:auto}
.shot .mark{position:absolute;border:2px solid var(--mark);box-shadow:0 0 0 2px rgba(0,0,0,.35);border-radius:3px;pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pair figcaption::before{content:attr(data-side);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px}
/* TABLE: hairlines only, title above as the caption, header sentence case, numbers right. */
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl caption{text-align:left;font-size:13.5px;color:var(--ink);padding:0 0 8px;caption-side:top}
.tbl th{text-align:left;font-weight:600;color:var(--heading);padding:6px 10px 6px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
/* A GAP: where an artifact should be and is not. Plain text, no box. */
.gap{font-size:14px;color:var(--muted);font-style:italic;padding-left:18px;border-left:3px solid var(--line)}

.tail{margin-top:72px;border-top:1px solid var(--line);padding-top:24px}
.tail p{font-size:14px;color:var(--muted);margin:0 0 8px}
@media (max-width:640px){.d{padding-left:0}summary{grid-template-columns:28px 1fr}summary .s{grid-column:2;text-align:left;padding-top:0}.pair{grid-template-columns:1fr}}
</style></head><body><main>

<div class="k"><!-- KICKER: two items, brand and date. Nothing else. --></div>
<h1><!-- TITLE: the one sentence they cannot miss. A finding with a verb, not a topic. --></h1>
<p class="lede"><!-- LEDE: under 45 words. <b>Bold one clause.</b> --></p>

<!-- NEEDS YOU. Always present, directly under the lede. If nothing needs them, say that in the same block. -->
<div class="you"><div class="k">Needs you · <!-- one thing | two decisions | nothing to decide --></div>
<p><!-- The decision or the action, as one sentence. --></p>
<!-- Options, only when there is a choice. Regular weight, one line each, under 15 words. Mark the recommendation:
<div class="q">1 · the question</div>
<ol><li class="rec">Option A, and what it costs</li><li>Option B</li></ol> -->
<small><!-- One line of context: why now, what is already true. --></small></div>

<h2><!-- SECTION LABEL: e.g. "Five things changed · open one to check it" --></h2>

<!-- ONE ROW PER CLAIM. The claim is a full sentence with a verb. The em is one line of how.
     The status: a filled dot for done or verified, a .w amber dot for partial, an .o hollow dot for not done.
     The figure: one number with its unit, or a count with its denominator. -->
<details><summary><span class="n">1</span><span class="c"><!-- CLAIM --><em><!-- how, in one line --></em></span><span class="s"><i></i><!-- figure --></span></summary><div class="d">

  <!-- SCREENSHOT with the passage marked. Percentages are of the image box. -->
  <figure class="shot"><div class="frame"><img src="data:image/jpeg;base64,<!-- -->" alt=""><div class="mark" style="left:15%;top:72%;width:14%;height:4%"></div></div>
  <figcaption><!-- What to look at, in a sentence. --> <span class="src"><!-- Where and when: the page, signed in as whom, the date. --></span> <a href="#"><!-- Open the live page --></a></figcaption></figure>

  <!-- BEFORE / AFTER -->
  <div class="pair">
    <figure class="shot"><div class="frame"><img src="data:image/jpeg;base64,<!-- -->" alt=""></div><figcaption data-side="Before"><!-- what it showed, when --></figcaption></figure>
    <figure class="shot"><div class="frame"><img src="data:image/jpeg;base64,<!-- -->" alt=""></div><figcaption data-side="After"><!-- what it shows, when --></figcaption></figure>
  </div>

  <!-- RAW ROWS, A DIFF HUNK, A LITERAL PROMPT. <b> marks the value the claim rests on. Diff lines: <span class="add">+ …</span> <span class="del">- …</span> -->
  <figure class="code"><pre><!-- verbatim --></pre><figcaption><!-- What this is and where it came from: the call, the file and PR, the date. --></figcaption></figure>

  <!-- A QUOTE. Under fifty words. No quotation marks. The speaker and date in the caption. -->
  <figure class="quote"><blockquote><p><!-- the words --></p></blockquote><figcaption><!-- Who, where, when. --></figcaption></figure>

  <!-- A SMALL TABLE. Title above as the caption. Numbers right, class="num". -->
  <figure class="tbl"><table><caption><!-- what the table shows --></caption><thead><tr><th><!-- Column --></th><th class="num"><!-- Number --></th></tr></thead><tbody><tr><td></td><td class="num"></td></tr></tbody></table></figure>

  <!-- A GAP. Where an artifact genuinely cannot be captured, say so where it would sit. A login is not a reason; a "before" nobody shot at the time is. -->
  <p class="gap"><!-- What is missing, why, and what stands in for it. --></p>

  <p><b><!-- Optional one-line reading of the artifact. --></b> <!-- What the reader should notice that the artifact does not say by itself. --></p>
</div></details>

<h2><!-- SECOND SECTION LABEL, e.g. "Six things did not · by design". Optional. --></h2>
<details class="small"><summary><span class="n">·</span><span class="c"><!-- claim --></span><span class="s"><i class="o"></i><!-- figure, or empty --></span></summary><div class="d"><p><!-- one line why --></p></div></details>

<div class="tail"><p><b><!-- What they will notice first. --></b> <!-- One or two sentences. --></p><p><!-- Where this came from: what was read, run and shot, and when. The refs (PRs, sessions, the page this follows) go here, as links. --></p></div>

</main></body></html>
